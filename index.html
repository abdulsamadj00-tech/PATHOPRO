<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Patho Pro</title>
  <script>
    // Restore the complete application from the last known-good revision.
    // This is temporary bootstrap code so the site remains usable while the
    // damaged generated index is replaced without losing the original app.
    (async function () {
      const sourceUrl = 'https://raw.githubusercontent.com/abdulsamadj00-tech/PATHOPRO/06699b5fcc52d8131cf9c366f39c1cdd0382adac/index.html';
      try {
        const response = await fetch(sourceUrl, { cache: 'no-store' });
        if (!response.ok) throw new Error('Unable to restore application');
        const html = await response.text();
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.body.innerHTML = '<main style="font-family:system-ui;padding:2rem"><h1>Patho Pro could not be loaded</h1><p>Please refresh the page. If the problem continues, disable the service worker/cache and reload.</p></main>';
        console.error(error);
      }
    }());
  </script>
</head>
<body>
  <main style="font-family:system-ui;padding:2rem">Loading Patho Pro…</main>
</body>
</html>
